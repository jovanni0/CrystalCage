why:
    title: Why Sanctum instead of Goodreads or StoryGraph?
    body: |
        These platforms combine a large user base with a huge catalog and recommendation algorithms, but none of them give you full access and control over your data, and none let you store the book files themselves.

        Sanctum is the opposite. It gives you control, at the cost of being individual: each account is an isolated library on a server you run. Your ebook files and your read history live in the same place, and no platform can remove them from your account. Think of it as your physical bookshelf, on the go.


