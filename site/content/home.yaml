# Home page. Short texts are plain strings; longer ones allow Markdown.

hero:
  title: Your library, your rules.
  lead: >-
    Sanctum is an open-source, self-hosted book manager. Keep your ebook
    files, your read history and your covers in one place, on a server you own.
  image: /images/home/hero-library.png     # TODO: screenshot of the library
  image_alt: The Sanctum library, a grid of book covers.
  actions:
    - label: Get the app
      href: "#download"
      style: primary
    - label: Host your server
      href: /docs/hosting
      style: secondary

features:
  - title: Store your ebooks
    text: Upload your ebook files to your server, in any format. EPUB, MOBI and PDF get their own color; anything else is kept as is.
    icon: file
  - title: Track every read
    text: Log when you started and finished a book, how far you are, rereads, past reads and books you did not finish.
    icon: history
  - title: Choose your covers
    text: Keep several covers for each book and pick the one your library shows.
    icon: image
  - title: Rich metadata
    text: Author, universe, series and volume, release date, word count, tags, a blurb and your own thoughts.
    icon: tag

why:
  title: Why Sanctum instead of Goodreads or StoryGraph?
  body: |
    These platforms combine a large user base with a huge catalog and
    recommendation algorithms, but none of them give you full access and
    control over your data, and none let you store the book files themselves.

    Sanctum is the opposite. It gives you control, at the cost of being
    individual: each account is an isolated library on a server you run.
    Your ebook files and your read history live in the same place, and no
    platform can remove them from your account. Think of it as your physical
    bookshelf, on the go.

paths:
