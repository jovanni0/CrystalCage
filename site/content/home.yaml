hero:
    eyebrow: Open source • Self-hosted
    title: Your library, your rules.
    lead: Sanctum is an open-source, self-hosted book manager. Keep your ebook files, your read history and your covers in one place, on a server you own.
    actions:
        - label: Get the app
          href: "#start"
          style: primary
        - label: Host your server
          href: /docs/hosting
          style: secondary
    screenshots:
        - src: /images/reads.png
          alt: The Reads tab of a book profile.
        - src: /images/library.png
          alt: The library, a grid of book covers.
        - src: /images/book.png
          alt: The Book tab of a book profile.


features:
    title: Everything about your books, in one place
    items:
        - title: Store your ebooks
          text: Upload your ebook files to your server, in any format.
          icon: file_type
        - title: Track every read
          text: Log when you started and finished a book, how far you are, rereads, past reads and books you did not finish.
          icon: calendar
        - title: Choose your covers
          text: Keep several covers for each book and pick the one your library shows.
          icon: file_image
        - title: Rich metadata
          text: Author, universe, series and volume, release date, word count, tags, a blurb and your own thoughts.
          icon: tags


